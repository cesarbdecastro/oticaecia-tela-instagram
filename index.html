<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; padding:0; background:#000; overflow:hidden; }
  .container { display:flex; width:100vw; height:100vh; }
  .left { width:50%; height:100%; display:flex; align-items:center; justify-content:center; background:#000; }
  .right { width:50%; height:100%; background:#111; color:#fff; display:flex; align-items:center; justify-content:center; padding:5vh 4vw; box-sizing:border-box; }
  .right p { margin:0; font-size:2vw; font-family:Arial, sans-serif; line-height:1.4; white-space:pre-wrap; max-height:100%; }
  #mediaContainer { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #mediaContainer video, #mediaContainer img { max-width:100%; max-height:100%; }
</style>
</head>
<body>
  <div class="container">
    <div class="left">
      <div id="mediaContainer"></div>
    </div>
    <div class="right" id="right">
      <p id="caption">Carregando...</p>
    </div>
  </div>

  <script>
    var ultimaMidia = '';
    var ultimaLegenda = '';

    // Diminui a fonte ate a legenda caber na coluna da direita
    function ajustarLegenda() {
      var p = document.getElementById('caption');
      var box = document.getElementById('right');
      var limite = box.clientHeight * 0.9;
      var tamanho = window.innerWidth * 0.022; // tamanho maximo
      var minimo = window.innerWidth * 0.009;  // tamanho minimo
      p.style.fontSize = tamanho + 'px';
      while (p.scrollHeight > limite && tamanho > minimo) {
        tamanho = tamanho * 0.95;
        p.style.fontSize = tamanho + 'px';
      }
    }

    async function loadContent() {
      try {
        var response = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
        var data = await response.json();

        if (data.video !== ultimaMidia) {
          ultimaMidia = data.video;
          var container = document.getElementById('mediaContainer');
          if (data.type === 'VIDEO') {
            container.innerHTML = '<video autoplay muted loop playsinline><source src="' + data.video + '" type="video/mp4"></video>';
          } else {
            container.innerHTML = '<img referrerpolicy="no-referrer" src="' + data.video + '">';
          }
        }

        if (data.caption !== ultimaLegenda) {
          ultimaLegenda = data.caption;
          document.getElementById('caption').innerText = data.caption;
          ajustarLegenda();
        }
      } catch (e) {
        console.error('Erro ao carregar data.json', e);
      }
    }

    window.addEventListener('resize', ajustarLegenda);
    loadContent();
    setInterval(loadContent, 30000);
  </script>
</body>
</html>
